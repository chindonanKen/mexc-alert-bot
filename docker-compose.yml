services:
  # Production / V1-compatible service (flags off unless you set them in .env)
  mexc-bot:
    build: .
    container_name: mexc-alert-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist alerts across container restarts/updates
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/app/data/alerts.db') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Staging: separate container + data dir + env so you never touch prod alerts.
  # Start with: docker compose --profile staging up -d --build mexc-bot-staging
  # Requires .env.staging with its own TELEGRAM_BOT_TOKEN (recommended: second bot).
  mexc-bot-staging:
    profiles: ["staging"]
    build: .
    container_name: mexc-alert-bot-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    volumes:
      - ./data-staging:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/app/data/alerts.db') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
