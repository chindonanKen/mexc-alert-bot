services:
  mexc-bot:
    build: .
    container_name: mexc-alert-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist alerts across container restarts/updates
      - ./data:/app/data
    # Optional: expose nothing (pure outbound + Telegram long-poll)
    # If you later add a small HTTP health server, uncomment:
    # ports:
    #   - "8080:8080"
    healthcheck:
      # Basic liveness check (storage file exists). We can improve this later
      # with a real /health endpoint once we add one.
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/app/data/alerts.db') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
