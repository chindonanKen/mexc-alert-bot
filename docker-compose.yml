services:
  # Production / V1-compatible service (flags off unless you set them in .env)
  mexc-bot:
    build: .
    container_name: mexc-alert-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist alerts across container restarts/updates
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/app/data/alerts.db') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Staging: separate container + data dir + env so you never touch prod alerts.
  # Start: ./scripts/staging_up.sh   OR
  #        docker compose --profile staging up -d --build mexc-bot-staging
  # Requires .env.staging with its own TELEGRAM_BOT_TOKEN (second BotFather bot).
  # Volume ./data-staging is isolated from prod ./data — both containers can run together.
  mexc-bot-staging:
    profiles: ["staging"]
    build: .
    container_name: mexc-alert-bot-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      # Force container data path (volume maps host data-staging → /app/data)
      ALERTS_FILE: /app/data/alerts.json
    volumes:
      - ./data-staging:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/app/data/alerts.db') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # V2 AD Desk web UI — reads same SQLite as prod (or staging if remapped)
  # Start: docker compose --profile desk up -d --build mexc-desk
  # Open:  http://DROPLET_IP:8080  (set DESK_API_TOKEN in .env)
  mexc-desk:
    profiles: ["desk"]
    build:
      context: .
      dockerfile: Dockerfile.desk
    container_name: mexc-ad-desk
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ALERTS_FILE: /app/data/alerts.json
      DESK_HOST: 0.0.0.0
      DESK_PORT: "8080"
    ports:
      - "${DESK_PORT:-8080}:8080"
    volumes:
      # RW required for desk CRUD (alerts / watchlist / journal labels)
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
