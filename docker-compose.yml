services:
  # Production / V1-compatible service (flags off unless you set them in .env)
  mexc-bot:
    build: .
    container_name: mexc-alert-bot
    restart: unless-stopped
    env_file:
      - .env
    # Host network so MEXC/CEX announcement fetches aren't 403'd on Docker bridge NAT
    network_mode: host
    volumes:
      # Persist alerts across container restarts/updates
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/app/data/alerts.db') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Staging: separate container + data dir + env so you never touch prod alerts.
  # Start: ./scripts/staging_up.sh   OR
  #        docker compose --profile staging up -d --build mexc-bot-staging
  # Requires .env.staging with its own TELEGRAM_BOT_TOKEN (second BotFather bot).
  # Volume ./data-staging is isolated from prod ./data — both containers can run together.
  mexc-bot-staging:
    profiles: ["staging"]
    build: .
    container_name: mexc-alert-bot-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      # Force container data path (volume maps host data-staging → /app/data)
      ALERTS_FILE: /app/data/alerts.json
    volumes:
      - ./data-staging:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/app/data/alerts.db') else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # V2 AD Desk app
  # HTTP guide (droplet Grok):  ./scripts/desk_up.sh        → http://IP:8080  (no mic)
  # Full + mic:                 ./scripts/desk_https_up.sh  → https://IP/ + :8080
  mexc-desk:
    profiles: ["desk", "desk-https"]
    build:
      context: .
      dockerfile: Dockerfile.desk
    container_name: mexc-ad-desk
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ALERTS_FILE: /app/data/alerts.json
      DESK_HOST: 0.0.0.0
      DESK_PORT: "8080"
    # Public HTTP for UI + text agent (mic blocked on http://IP — browser secure context)
    ports:
      - "8080:8080"
    volumes:
      # RW: desk CRUD (alerts, journal, watchlist). Does not poll Telegram or place orders.
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

  # HTTPS reverse proxy for microphone (openssl self-signed IP SAN — see desk_gen_certs.sh)
  # Start: ./scripts/desk_https_up.sh
  # Open: https://DROPLET_IP/?token=DESK_API_TOKEN  (Advanced → Proceed)
  mexc-desk-https:
    profiles: ["desk-https"]
    image: caddy:2-alpine
    container_name: mexc-desk-https
    restart: unless-stopped
    depends_on:
      - mexc-desk
    ports:
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: