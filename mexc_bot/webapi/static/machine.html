<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/machine.css?v=s3" />
</head>
<body class="room" data-tone="empty" data-live="0">
  <header class="mast">
    <a class="brand" href="/machine">MACHINE</a>
    <p class="book" id="bookLine">$200 book idle · max 2 live</p>
    <a class="desk" href="/">desk</a>
  </header>

  <section class="stages" aria-label="Live stages">
    <div id="liveStages" class="stage-col">
      <div class="stage open">
        <p class="slot-lbl">SLOT 1</p>
        <p class="ghost">waiting · $200 book</p>
      </div>
      <div class="stage open">
        <p class="slot-lbl">SLOT 2</p>
        <p class="ghost">waiting · max 2 live</p>
      </div>
    </div>
  </section>

  <section id="needsStack" class="needs" hidden></section>

  <section class="ranks" aria-label="Ranked instruments">
    <h2>Ranked</h2>
    <div id="rankList" class="empty-ranks">
      <div class="rank skeleton"><span class="idx">01</span><span class="bone"></span><span class="bone short"></span><span class="bone"></span></div>
      <div class="rank skeleton"><span class="idx">02</span><span class="bone"></span><span class="bone short"></span><span class="bone"></span></div>
      <div class="rank skeleton"><span class="idx">03</span><span class="bone"></span><span class="bone short"></span><span class="bone"></span></div>
    </div>
  </section>

  <div id="sheetBack" class="sheet-back" hidden></div>
  <aside id="planSheet" class="sheet" hidden></aside>
  <div id="toast" hidden></div>
  <script src="/assets/machine.js?v=s3"></script>
</body>
</html>
