<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MACHINE</title>
  <link rel="stylesheet" href="/machine/static/style.css?v=adb2" />
</head>
<body>
  <div id="rail"></div>
  <section id="gate" class="hidden">
    <form id="gate-form" autocomplete="on">
      <div class="gate-kicker">open machine</div>
      <p class="gate-copy">Same token as the AD Desk. Typed here — never kept in the page.</p>
      <label class="sr" for="gate-token">Desk token</label>
      <input id="gate-token" name="token" type="password" autocomplete="current-password" required />
      <button type="submit">Open</button>
      <p id="gate-err" class="gate-err hidden"></p>
    </form>
  </section>
  <header id="head">
    <div class="brand">MACHINE</div>
    <div class="book">$<span id="book">200</span> book · <span id="liveN">0</span> of 2 live</div>
    <div class="badge">live orders off</div>
    <button id="sign-out" type="button" class="hidden">sign out</button>
  </header>

  <section id="slots">
    <div class="slot ghost" id="slot0"><div class="slot-label">SLOT 1</div><div class="open">open book</div></div>
    <div class="slot ghost" id="slot1"><div class="slot-label">SLOT 2</div><div class="open">open book</div></div>
  </section>

  <section id="needs" class="hidden">
    <div class="needs-kicker">needs-you</div>
    <div id="needs-body"></div>
  </section>

  <section id="tape">
    <div class="tape-kicker">tape · decisions only</div>
    <div id="tape-rows"></div>
  </section>

  <section id="ranked">
    <div class="ranked-kicker">ranked</div>
    <div id="ranked-rows"></div>
  </section>

  <aside id="sheet" class="hidden">
    <button id="sheet-close" type="button">×</button>
    <div id="sheet-head"></div>
    <div class="block">
      <div class="kicker">IN</div>
      <div id="sheet-in"></div>
    </div>
    <div class="block">
      <div class="kicker">OUT</div>
      <div id="sheet-out"></div>
    </div>
    <div id="sheet-foot"></div>
  </aside>

  <script src="/machine/static/app.js?v=adb2"></script>
</body>
</html>
